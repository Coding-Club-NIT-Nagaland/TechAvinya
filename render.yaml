services:
  - type: web
    name: tech-avinya-backend
    env: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: RESEND_FROM_EMAIL
        value: Tech Avinya 2026 <onboarding@resend.dev>
